# Audit M7: every push and pull request runs the tests, the lint gate and a dependency audit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        exclude:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,formgen,studies,mcp]"
      - name: Lint gate (ruff, rules in pyproject.toml)
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest -p no:cacheprovider -rfE

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,formgen,studies,mcp]"
      - name: pip-audit (installed environment)
        run: python -m pip_audit --progress-spinner off --skip-editable
