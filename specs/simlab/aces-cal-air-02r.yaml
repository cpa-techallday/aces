id: aces-cal-air-02r
project: ACES-calibration
owner: aaron
physics: cfd
solver: aces-tpms-periodic
description: 'ACES calibration samples: periodic gyroid, diamond unit cells, t/a [0.2, 0.24, 0.28], Re [10.0, 30.0,
  100.0], Air at 320 K, 96 voxels per cell.'
hypothesis: Pressure drop and H1 heat transfer of TPMS cores differ from the straight-duct baselines by a factor
  that is constant enough over this range to calibrate the fast tier.
expected: dpdx and H1 h per case (rows carry boundary uniform_heat_flux); fitted with `aces calibrate`, which takes
  the boundary from the rows.
rd_activity: ACES fast-tier calibration of TPMS heat-exchanger cores
company: carbon
params:
  cell_m: 0.004
  fluid: Air
  T_K: 320.0
  p_Pa: 200000.0
  n: 96
  thermal: true
outputs:
- re_achieved
- dpdx_Pa_m
- mass_flux_kg_m2s
- h_W_m2K
- nusselt_h1
- mach
resources:
  precision: float64
  vram_gb: 4.0
tags:
  kind: calibration
  system: hx
  origin: aces
sweep:
  tpms:
  - gyroid
  - diamond
  wall_ratio:
  - 0.2
  - 0.24
  - 0.28
  re:
  - 10.0
  - 30.0
  - 100.0
geometry:
  source: parametric
