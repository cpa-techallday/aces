[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aces"
version = "0.1.0"
description = "ACES: Advanced Computational Engineering System. Spec to physics-true design models, multi-objective search, solver verification and R&D evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Carbon Project Australia Pty Ltd" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "optuna>=3.6",
    "CoolProp>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# formgen lattice route; the verified Windows set is pinned in requirements-formgen.txt
formgen = [
    "trimesh>=4.0",
    "cascadio>=0.1.1",
    "manifold3d>=3.0",
    "fast_simplification>=0.1",
    "networkx>=3.0",
    "shapely>=2.0",
    "pillow>=10.0",
    "PyNiteFEA>=1.0",  # structural check (aces.structures)
]
# design studies under studies/ (ARC-1 rod-lattice chassis)
studies = [
    "PyNiteFEA>=0.0.94",
    "matplotlib>=3.7",
    "trimesh>=4.0",
    "rtree>=1.0",
]

# MCP server for Mission Control agents (mcp 1.x FastMCP or 2.x MCPServer)
mcp = ["mcp>=1.10"]

[project.scripts]
aces = "aces.cli:main"
aces-mcp = "aces.mcp_server:main"
formgen = "formgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aces = ["domains/hx/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:skimage.*"]
