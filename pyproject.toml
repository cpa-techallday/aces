[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aces"
version = "0.1.0"
description = "ACES: Advanced Computational Engineering System. Spec to physics-true design models, multi-objective search, solver verification and R&D evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Carbon Project Australia Pty Ltd" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "optuna>=3.6",
    "CoolProp>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aces = "aces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aces = ["domains/hx/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:skimage.*"]
