# TEST INPUT ONLY. Not rates, not quotes, not material data.
#
# These round numbers exist to exercise `aces.costing` and to show the shape of an `aces cost --rates` file.
# Every source below says "test input", and the material ids are deliberately generic (metal_a, metal_b,
# polymer_a) so nothing here can be mistaken for a real alloy, polymer, bureau or price. Never quote a cost
# made with this file.
#
# Shape: every number is {value, source, date}; the source is the quote, invoice or datasheet the value came
# from. A cost-calibration registry (D25) can add keys to these entries (for example the quotes behind a
# value) without changing what aces.costing reads.
